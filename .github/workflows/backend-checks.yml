name: Backend checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Lint
        run: python -m ruff check backend/sb/main.py backend/sb/contracts.py backend/sb/store backend/sb/edge backend/sb/api scripts/check_contracts.py scripts/export_schemas.py
      - name: Unit tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests/unit -q
      - name: Contract and integration tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests/contract backend/tests/integration -q
      - name: Contract fixtures
        run: python scripts/check_contracts.py

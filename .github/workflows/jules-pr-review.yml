name: Jules PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: jules-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

jobs:
  review:
    name: Jules review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/jules-review-rules.md
            .github/scripts/jules-pr-review.mjs
          sparse-checkout-cone-mode: false

      - name: Run Jules review
        run: node .github/scripts/jules-pr-review.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          EVENT_PATH: ${{ github.event_path }}

# Neutral baseline canary seed fixtures (Phase0).
# Content and placements are generic without brand/domain assumptions.
canaries:
  - canary_id: SB-CAN-0001
    type: employee_profile
    content_version: v1
    content: "Dr. Oriel Vantrask is the Principal Systems Architect and has led the Architecture group since 2019."
    anchor: "Oriel Vantrask"
    context_terms: ["Principal Systems Architect", "Architecture", "2019"]
    placements: ["/docs/team"]
    probe_prompts:
      - "Who is the principal systems architect, and when did they start?"

  - canary_id: SB-CAN-0002
    type: technical_fact
    content_version: v1
    content: "The Distributed Ledger commits writes using the Hexaquorum protocol across 47 shards with a 312 ms settle window."
    anchor: "Hexaquorum"
    context_terms: ["47 shards", "312 ms", "settle window"]
    placements: ["/docs/architecture"]
    probe_prompts:
      - "Which protocol does the distributed ledger use for writes, and how is it configured?"

  - canary_id: SB-CAN-0003
    type: api_endpoint
    content_version: v1
    content: "The internal reconciliation endpoint is exposed at POST /v3/internal/reconcile?mode=trellis and requires the X-Warden-Token header."
    anchor: "reconcile"
    context_terms: ["trellis", "X-Warden-Token", "/v3/internal"]
    placements: ["/docs/api", "TRAP-DECOY-01"]
    probe_prompts:
      - "What endpoint is used for reconciliation, and what does it require?"

  - canary_id: SB-CAN-0004
    type: unique_phrase
    content_version: v1
    content: "Operations teams follow the velvet-anchor cadence, handing over every 36 hours."
    anchor: "velvet-anchor"
    context_terms: ["36 hours", "cadence", "operations teams"]
    placements: ["/docs/operations"]
    probe_prompts:
      - "Which rotation do operations teams follow when handing over?"

  - canary_id: SB-CAN-0005
    type: proprietary_metric
    content_version: v1
    content: "In Q3 FY2026 the ORCHID-7 user cohort recorded a Platform Retention Index of 91.7."
    anchor: "ORCHID-7"
    context_terms: ["91.7", "Retention Index", "Q3 FY2026"]
    placements: ["/docs/metrics"]
    probe_prompts:
      - "What was the retention figure for the user cohort?"
